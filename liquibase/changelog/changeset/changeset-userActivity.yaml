databaseChangeLog:
  - changeSet:
      id: 1
      author: Emanuel Arispe
      changes:
        - createTable:
            tableName: UserActivity
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
                    autoincrement: true
              - column:
                  name: id_user
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_user
                    nullable: false
              - column:
                  name: id_activity
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_activity
                    nullable: false