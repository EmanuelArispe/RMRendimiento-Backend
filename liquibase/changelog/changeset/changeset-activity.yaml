databaseChangeLog:
  - changeSet:
      id: 1
      author: Emanuel Arispe
      changes:
        - createTable:
            tableName: Activity
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
                    autoincrement: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true